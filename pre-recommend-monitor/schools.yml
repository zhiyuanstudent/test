settings:
  timezone: Asia/Shanghai
  target_year: auto
  lookback_days: 300
  max_results_per_school: 8
  max_pages_per_school: 5
  request_timeout_seconds: 18
  concurrent_workers: 8
  notify_initial_run: true
  assignee: zhiyuanstudent
  major_keywords:
    - 计算机
    - 软件
    - 人工智能
    - 网络空间安全
    - 网络安全
    - 数据科学
    - 智能科学
    - 电子信息
    - 信息工程
    - 自动化
  notice_keywords:
    - 预推免
    - 推免预报名
    - 接收推荐免试
    - 推荐免试研究生
    - 推免生
    - 直博生
    - 优秀大学生
    - 校园开放日
    - 暑期学校
    - 夏令营
    - 选拔营
  exclude_keywords:
    - 本科生推免资格
    - 推免资格名单
    - 拟推荐名单
    - 推免名额分配
    - 推荐资格公示

