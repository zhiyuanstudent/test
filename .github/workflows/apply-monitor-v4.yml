name: 应用预推免监控筛选修复

on:
  workflow_dispatch:
  push:
    paths:
      - "pre-recommend-monitor/apply_v4_patch.py"
      - ".github/workflows/apply-monitor-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          python pre-recommend-monitor/apply_v4_patch.py
          python -m py_compile pre-recommend-monitor/monitor_v3.py

      - name: Commit patched monitor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pre-recommend-monitor/monitor_v3.py
          if git diff --cached --quiet; then
            echo "Monitor is already patched."
            exit 0
          fi
          git commit -m "fix: tighten pre-recommend notice filtering"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
