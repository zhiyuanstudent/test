name: 每日预推免监控

on:
  schedule:
    # 北京时间每天 09:00（GitHub Actions 使用 UTC）
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pre-recommend-monitor/monitor.py"
      - "pre-recommend-monitor/schools.yml"
      - "pre-recommend-monitor/requirements.txt"
      - ".github/workflows/pre-recommend-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: pre-recommend-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pre-recommend-monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r pre-recommend-monitor/requirements.txt

      - name: Crawl official notices
        id: monitor
        run: python pre-recommend-monitor/monitor.py

      - name: Commit report and deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pre-recommend-monitor/data/latest.md \
                  pre-recommend-monitor/data/alerts.md \
                  pre-recommend-monitor/data/state.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update pre-recommend monitor $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"

      - name: Create notification issue
        if: steps.monitor.outputs.alert_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: ${{ steps.monitor.outputs.issue_title }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ALERT_TITLE" \
            --body-file pre-recommend-monitor/data/alerts.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
